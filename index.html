    <script>
      // Silenciar erro de WebSocket do Vite (comum em ambientes de desenvolvimento restritos)
      window.addEventListener('unhandledrejection', (event) => {
        if (event.reason && event.reason.message && (event.reason.message.includes('WebSocket') || event.reason.message.includes('failed to connect'))) {
          event.preventDefault();
        }
      });
      // Capturar erros de log do console para evitar poluição visual de infraestrutura
      const originalError = console.error;
      console.error = (...args) => {
        if (args[0] && typeof args[0] === 'string' && (args[0].includes('[vite] failed to connect') || args[0].includes('WebSocket'))) {
          return;
        }
        originalError.apply(console, args);
      };
    </script>
